[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halluscope-routing"
version = "0.1.0"
description = "Tiered risk-routing layer for model-generated content: score, calibrate per deployment, route to return, escalate or review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Pinned to the versions installed when the committed results were generated (pip freeze, 2026-09-14).
dependencies = [
    "numpy==2.3.5",
    "pandas==3.0.1",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.8",
    "pydantic==2.12.5",
    "openai==2.32.0",
    "python-dotenv==1.2.2",
    "sentence-transformers==5.4.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "ruff==0.15.7", "PyYAML==6.0.3"]

[project.scripts]
halluscope-route = "routing.cli:main"

[tool.setuptools]
packages = ["routing"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
