name: ci

on:
  push:
  pull_request:

jobs:
  test-and-determinism:
    runs-on: ubuntu-latest
    steps:
      # Full history: the Study 2 evaluator records the commit of docs/PREREG_2.md.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU torch keeps the install small. The score extra is needed by the routing pipeline test (SBERT).
      - name: Install with pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[test,score]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests -q
      # The routing score step is excluded: it calls the API and downloads SBERT. The committed
      # data/*_scores.csv files are the input. Figures are excluded because PNG bytes vary across font setups.
      - name: Regenerate routing calibration, report and handoff from committed CSVs
        run: |
          python -m routing.cli calibrate
          python -m routing.cli evaluate
          python scripts/fill_handoff.py
          python -m routing.cli judge-change
          python -m routing.cli calibration-change
      - name: Regenerate itemtriage exploratory, Study 2 (from cached IRT fits), report and README block
        run: |
          python -m itemtriage.cli explore
          python -m itemtriage.cli api-point
          python -m itemtriage.cli study2
          python -m itemtriage.cli report
      - name: Determinism check
        run: git diff --exit-code -- reports/ results/*.json results/*.md results/itemtriage/*.json HANDOFF.md README.md
