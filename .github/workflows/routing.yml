name: routing

on:
  push:
  pull_request:

jobs:
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the routing package with its pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Unit tests
        run: pytest tests/ -q
      # The score step is excluded on purpose: it downloads the SBERT model for the consistency
      # scorer. The committed data/*_scores.csv files are the input here. Figures are excluded
      # from the diff because PNG bytes vary across font environments.
      - name: Regenerate calibration, report and handoff from committed CSVs (no API key)
        run: |
          python3 -m routing.cli calibrate
          python3 -m routing.cli evaluate
          python3 scripts/fill_handoff.py
      - name: Determinism check
        run: git diff --exit-code -- reports/ results/*.json results/*.md HANDOFF.md
