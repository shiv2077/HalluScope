# ─────────────────────────────────────────────────────────────────────────────
# HalluScope V4 Risk Configuration
# ─────────────────────────────────────────────────────────────────────────────

# HRI = sigmoid(Σ w_i * signal_i * 10 + bias)
# Weights are per-regime (see llm_backend_v4.py WEIGHT_PROFILES)

# Default (GENERATIVE regime) weights:
weights:
  w_entropy: 0.20
  w_energy: 0.10
  w_variance: 0.20
  w_csg: 0.30
  w_lld: 0.20
  w_rcd: 0.10
  bias: -2.5

# Risk thresholds
thresholds:
  low: 0.45
  high: 0.70

# Signal gating (tokens before signal activates)
gating:
  entropy_min_tokens: 2
  semantic_min_tokens: 8
  lld_min_tokens: 10
  rcd_min_tokens: 10
  early_stop_min_tokens: 12

# Signal clamping
clamping:
  csg_max: 0.6
  lld_max: 0.5
  rcd_max: 0.5

# Performance tuning
performance:
  csg_compute_interval: 8     # CSG every N tokens
  lld_compute_interval: 5     # LLD every N tokens
  lld_sample_layers: 4        # Sparse layer sampling for LLD
